name: Publicar no GitHub Pages

# Publica o app em https://tropical-yetti.github.io/PlanBuilder/ a cada atualização da main
# (ou manualmente, pela aba Actions). Para funcionar, o Pages precisa estar configurado uma vez em
# Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; uma nova não interrompe a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build (caminho base /PlanBuilder/)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Branch policy

on:
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validar branch de origem
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            dev)
              [[ "$HEAD" == feat/* || "$HEAD" == main ]] && exit 0
              echo "::error::PRs para dev devem vir de feat/* (recebido: $HEAD)"; exit 1 ;;
            main)
              [[ "$HEAD" == fix/* || "$HEAD" == dev ]] && exit 0
              echo "::error::PRs para main devem vir de fix/* ou dev (recebido: $HEAD)"; exit 1 ;;
          esac
